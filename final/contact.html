<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <img src="/final/assets/logo.svg" alt="JJ Enterprises logo" width="48" height="48"> JJ Enterprises

      <button id="navToggle" class="nav-toggle" aria-controls="primary-nav" aria-expanded="false">☰<span class="sr-only">Toggle navigation</span></button>

      </nav>

  </header>

  <main class="container">
    <h1>Contact Us</h1>
    <p>Use the form below to send us a message. This form uses GET so the action page can display the submitted data.</p>

    <form id="contactForm" action="form-action.html" method="get">
      <label for="name">Name</label>
      <input id="name" name="name" required>

      <label for="email">Email</label>
      <input id="email" name="email" type="email" required>

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="6" required></textarea>

      <button type="submit" class="btn">Send Message</button>
    </form>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span id="year"></span> JJ Enterprises</p>
      <p><a href="#" id="videoLink3">Demo video (placeholder)</a></p>
    </div>
  </footer>

  <script type="module" src="/final/js/main.js"></script>
