<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>JJ Enterprise — Services & Catalog</title>
  <meta name="description" content="Filterable product catalog and service listings for JJ Enterprise." />
  <meta name="author" content="Joseph John" />
  <link rel="icon" href="images/favicon.svg" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="brand"><a href="index.html">JJ Enterprise</a></div>
    <button class="nav-toggle" aria-expanded="false" aria-controls="primary-navigation" aria-label="Toggle navigation">☰</button>
    <nav id="primary-navigation" class="primary-navigation" aria-label="Main">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="services.html" aria-current="page">Services & Catalog</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="catalog-controls">
      <label for="search">Search</label>
      <input id="search" type="search" placeholder="Search products..." />
      <label for="category">Category</label>
      <select id="category">
        <option value="">All</option>
      </select>
      <button id="clear-filters">Clear</button>
    </section>

    <section id="catalog" class="catalog" aria-live="polite">
      <!-- Product cards injected here -->
    </section>
  </main>

  <!-- Modal container -->
  <div id="modal" class="modal" role="dialog" aria-hidden="true" aria-labelledby="modal-title">
    <div class="modal-content">
      <button id="modal-close" class="modal-close" aria-label="Close dialog">×</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="footer-products">
      <h3>Featured Products</h3>
      <div class="product-thumbs">
        <img src="images/product-1.svg" alt="Cloud Integration Plan thumbnail" loading="lazy" width="120" height="68">
        <img src="images/product-3.svg" alt="Analytics Suite thumbnail" loading="lazy" width="120" height="68">
        <img src="images/product-4.svg" alt="API Gateway thumbnail" loading="lazy" width="120" height="68">
        <img src="images/product-7.svg" alt="Mobile App License thumbnail" loading="lazy" width="120" height="68">
      </div>
    </div>

    <div class="footer-meta">
      <p>© 2026 JJ Enterprise</p>
      <div class="social-links" aria-label="Social media links">
        <a href="https://instagram.com" target="_blank" rel="noopener" aria-label="Instagram"><img src="images/instagram.svg" alt="Instagram logo" width="28" height="28"></a>
        <a href="https://facebook.com" target="_blank" rel="noopener" aria-label="Facebook"><img src="images/facebook.svg" alt="Facebook logo" width="28" height="28"></a>
        <a href="https://twitter.com" target="_blank" rel="noopener" aria-label="Twitter"><img src="images/twitter.svg" alt="Twitter logo" width="28" height="28"></a>
      </div>
      <p><a href="video/demo_link.txt">Demo Video Link</a></p>
    </div>
  </footer>

  <script type="module">
    import { initCatalog } from './js/catalog.js';
    initCatalog();
  </script>
</body>
</html>
