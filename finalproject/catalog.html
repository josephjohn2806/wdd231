<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JJ Enterprise — Catalog</title>
  <meta name="description" content="Catalog of equipment and services from JJ Enterprise.">
  <link rel="canonical" href="https://josephjohn2806.github.io/wdd231/finalproject/catalog.html">
  <link rel="stylesheet" href="styles/finalproject.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header">
    <nav class="nav container" role="navigation" aria-label="Main">
      <a href="index.html" class="logo" aria-label="JJ Enterprise homepage"><span class="globe-icon" aria-hidden="true">🌐</span> JJ ENTERPRISE</a>
      <button id="nav-toggle" class="nav-toggle" aria-expanded="false" aria-controls="nav-links">Menu</button>
      <ul id="nav-links" class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="catalog.html" aria-current="page">Catalog</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main id="main-content" class="container section">
    <h1>Equipment &amp; Services Catalog</h1>

    <div class="controls" role="region" aria-label="Filters">
      <button class="btn btn-secondary filter-btn" data-category="All">All</button>
      <button class="btn btn-secondary filter-btn" data-category="Equipment">Equipment</button>
      <button class="btn btn-secondary filter-btn" data-category="Services">Services</button>
      <button class="btn btn-secondary filter-btn" data-category="Consulting">Consulting</button>
    </div>

    <div id="catalog-grid" class="card-grid" aria-live="polite"></div>

    <dialog id="item-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title" class="sr-only">Item details</h2>
      <div id="modal-content"></div>
      <div style="margin-top:18px;"><button id="close-modal" class="btn btn-primary">Close</button></div>
    </dialog>
  </main>

  <footer class="site-footer">
    <div class="container footer-grid">
      <p>© <span data-year></span> JJ Enterprise. <a href="attributions.html">Attributions</a></p>
      <p><a href="https://www.youtube.com/watch?v=1QvGh8K5YsQ" target="_blank" rel="noopener">Video Demo (placeholder)</a></p>
    </div>
  </footer>

  <script type="module" src="scripts/main.js"></script>
  <script type="module" src="scripts/catalog.mjs"></script>
</body>
</html>
