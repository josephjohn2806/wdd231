<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Projects — GreenWorks</title>
  <meta name="description" content="Projects page — search and filter the collection of green projects.">
  <meta name="author" content="Joseph John">
  <meta property="og:title" content="GreenWorks — Projects">
  <meta property="og:description" content="A searchable collection of projects generated dynamically from JSON data.">
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="container">
      <h1 class="site-brand">GreenWorks</h1>
      <button class="nav-toggle" aria-controls="primary-navigation" aria-expanded="false">☰<span class="visually-hidden">Menu</span></button>
      <nav id="primary-navigation" class="primary-navigation">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="projects.html" aria-current="page">Projects</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main" class="container">
    <h2>All Projects</h2>

    <div class="search-bar">
      <label for="search">Search projects</label>
      <input id="search" name="search" type="search" placeholder="Search by title or description">
      <label for="category" class="visually-hidden">Filter by category</label>
      <select id="category">
        <option value="">All categories</option>
        <option value="Design">Design</option>
        <option value="Product">Product</option>
        <option value="Kit">Kit</option>
        <option value="Article">Article</option>
        <option value="Event">Event</option>
        <option value="App">App</option>
        <option value="Download">Download</option>
        <option value="DIY">DIY</option>
        <option value="Community">Community</option>
        <option value="Guide">Guide</option>
        <option value="Tool">Tool</option>
      </select>
    </div>

    <section class="items">
      <div id="cards" class="card-grid" aria-live="polite"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span id="year"></span> GreenWorks — <a href="attributions.html">Attributions</a> — <a href="https://youtu.be/PLACEHOLDER">Demo Video</a></p>
    </div>
  </footer>

  <script type="module" src="assets/js/main.js"></script>
</body>
</html>
