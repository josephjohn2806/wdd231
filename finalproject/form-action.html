  <main id="main" class="container">

  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span id="year"></span> My Final Project — <a href="#">Attributions</a> — <a href="#">Demo Video</a></p>
    </div>
  </footer>

  <script>
    // Parse query params from the GET form
    const params = new URLSearchParams(location.search);
    const result = document.getElementById('result');
    if ([...params.keys()].length === 0) {
      result.innerHTML = '<p>No form data submitted. Make sure the form uses method="GET" and action="form-action.html".</p>';
    } else {
      const entries = Array.from(params.entries()).map(([k,v]) => `<dt>${k}</dt><dd>${escapeHtml(v)}</dd>`).join('');
      result.innerHTML = `<dl>${entries}</dl>`;
    }
    function escapeHtml(s){ return s.replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
