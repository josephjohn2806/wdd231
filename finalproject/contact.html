<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contact — Final Project</title>
  <meta name="description" content="Contact page for the final project site.">
  <meta name="author" content="Joseph John">
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="container">
      <h1 class="site-brand">My Final Project</h1>
      <button class="nav-toggle" aria-controls="primary-navigation" aria-expanded="false">☰<span class="visually-hidden">Menu</span></button>
      <nav id="primary-navigation" class="primary-navigation">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="projects.html">Projects</a></li>
          <li><a href="contact.html" aria-current="page">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main" class="container">
    <h2>Contact Me</h2>
    <p>If you'd like to get in touch about this project or request changes, please fill out the form below.</p>

    <form action="form-action.html" method="get" class="contact-form" novalidate>
      <label for="name">Name</label>
      <input id="name" name="name" required>

      <label for="email">Email</label>
      <input id="email" name="email" type="email" required>

      <label for="topic">Topic</label>
      <select id="topic" name="topic">
        <option value="general">General</option>
        <option value="feedback">Feedback</option>
        <option value="content">Content Update</option>
      </select>

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="6" required></textarea>

      <p><button class="btn" type="submit">Send</button></p>
    </form>

  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span id="year"></span> My Final Project — <a href="attributions.html">Attributions</a> — <a href="#">Demo Video</a></p>
    </div>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
