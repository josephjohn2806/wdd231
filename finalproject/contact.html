<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JJ Enterprise — Contact</title>
  <meta name="description" content="Contact JJ Enterprise for quotes and maintenance requests.">
  <link rel="stylesheet" href="styles/finalproject.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header">
    <nav class="nav container" role="navigation" aria-label="Main">
      <a href="index.html" class="logo" aria-label="JJ Enterprise homepage"><span class="globe-icon" aria-hidden="true">🌐</span> JJ ENTERPRISE</a>
      <button id="nav-toggle" class="nav-toggle" aria-expanded="false" aria-controls="nav-links">Menu</button>
      <ul id="nav-links" class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="catalog.html">Catalog</a></li>
        <li><a href="contact.html" aria-current="page">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main id="main-content" class="container section container--narrow">
    <h1>Contact Our Operations Team</h1>
    <form id="contact-form" action="form-results.html" method="get" class="card" novalidate>
      <label for="fullname">Full Name *</label>
      <input id="fullname" name="fullname" type="text" required>

      <label for="email">Email Address *</label>
      <input id="email" name="email" type="email" required>

      <label for="service">Service Category</label>
      <select id="service" name="service">
        <option>Equipment Purchasing</option>
        <option>Maintenance Dispatch</option>
        <option>Consulting Advisory</option>
      </select>

      <label for="comments">Comments / Inquiry</label>
      <textarea id="comments" name="comments" rows="5"></textarea>

      <div style="margin-top:12px;"><button type="submit" class="btn btn-primary">Submit</button></div>
    </form>
  </main>

  <footer class="site-footer">
    <div class="container footer-grid">
      <p>© <span data-year></span> JJ Enterprise. <a href="attributions.html">Attributions</a></p>
      <p><a href="https://www.youtube.com/watch?v=1QvGh8K5YsQ" target="_blank" rel="noopener">Project Video Demonstration (placeholder)</a></p>
    </div>
  </footer>

  <script type="module" src="scripts/main.js"></script>
</body>
</html>
