<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JJ Enterprise — Contact</title>
<meta name="description" content="Contact JJ Enterprise for industrial quotes and maintenance requests.">
<meta name="author" content="Joseph John">
<meta property="og:title" content="Contact JJ Enterprise">
<meta property="og:type" content="website">
<meta property="og:image" content="images/favicon.ico">
<link rel="icon" href="images/favicon.ico">
<link rel="stylesheet" href="styles/finalproject.css">
</head>
<body>

<header class="site-header">
  <nav class="nav">
    <a href="index.html" class="logo"><span class="globe-icon" aria-hidden="true">🌐</span> JOSEPH JOHN</a>
    <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation menu" aria-expanded="false">☰</button>
    <ul class="nav-links" id="nav-links">
      <li><a href="index.html">HOME</a></li>
      <li><a href="catalog.html">CHAMBER PROJECT</a></li>
      <li><a href="contact.html" aria-current="page">FINAL PROJECT</a></li>
    </ul>
  </nav>
</header>

<main class="container section">
  <h1>Contact Our Operations Team</h1>
  
  <form action="form-results.html" method="get" class="card" style="max-width: 600px; display: flex; flex-direction: column; gap: 15px;">
    <div>
      <label for="fullname">Full Name *</label>
      <input type="text" id="fullname" name="fullname" required style="width: 100%; padding: 10px;">
    </div>
    <div>
      <label for="email">Email Address *</label>
      <input type="email" id="email" name="email" required style="width: 100%; padding: 10px;">
    </div>
    <div>
      <label for="service">Service Category</label>
      <select id="service" name="service" style="width: 100%; padding: 10px;">
        <option value="Equipment">Equipment Purchasing</option>
        <option value="Maintenance">Maintenance Dispatch</option>
        <option value="Consulting">Consulting Advisory</option>
      </select>
    </div>
    <div>
      <label for="comments">Comments/Inquiry</label>
      <textarea id="comments" name="comments" rows="4" style="width: 100%; padding: 10px;"></textarea>
    </div>
    <button type="submit" class="btn btn-primary">Submit Form</button>
  </form>
</main>

<footer class="site-footer">
  <div class="container footer-grid">
    <p>© <span data-year></span> Joseph John. <a href="attributions.html" style="color:#fff;">Attributions</a></p>
  </div>
</footer>

<script type="module" src="scripts/main.mjs"></script>
</body>
</html>
