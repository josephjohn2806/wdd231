<body>
  <div class="container">
    <header>
      <div class="logo">JJ Enterprise</div>
      <nav class="nav-pill">
        <a href="index.html">Home</a>
        <a href="contact.html">Contact</a>
        <a href="attributions.html">Attributions</a>
      </nav>
      <a href="index.html#product-gallery" class="btn-donate">Shop Catalog</a>
    </header>

    <main class="contact-wrapper">
      <h1>Contact JJ Enterprise</h1>
      <p>Have questions about our products, order statuses, or business partnerships? Send us a message below.</p>

      <form id="contact-form">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" placeholder="Your Name" required>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
          <label for="message">Product Inquiry / Message</label>
          <textarea id="message" name="message" rows="5" placeholder="Which products or services are you inquiring about?" required></textarea>
        </div>

        <button type="submit" class="btn-submit">Send Message</button>
      </form>
      <div id="form-feedback"></div>
    </main>

    <footer>
      <p>&copy; 2026 JJ Enterprise. All Rights Reserved.</p>
      
      <div class="footer-links">
        <a href="attributions.html">Attributions</a>
        <a href="https://youtube.com" target="_blank" rel="noopener">Video Demonstration</a>
      </div>

      <div class="social-icons">
        <a href="https://facebook.com" class="social-icon" target="_blank" rel="noopener" aria-label="Facebook">

        </a>

        </a>
        <a href="https://instagram.com" class="social-icon" target="_blank" rel="noopener" aria-label="Instagram">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect></svg>
